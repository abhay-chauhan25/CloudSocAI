[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudsoc"
version = "0.1.0"
description = "AWS-focused cloud SIEM, CSPM, and AI-assisted security investigation platform (portfolio prototype)."
requires-python = ">=3.12"
authors = [{ name = "Abhay Chauhan" }]
# Runtime dependencies are added one at a time, by the task that needs them.
dependencies = [
    "pydantic>=2.7",  # typed, validated schemas (Event, later API models)
    "pydantic-settings>=2.2",  # typed configuration from environment variables / .env
    "sqlalchemy>=2.0",  # ORM and SQL query builder
    "psycopg[binary]>=3.1",  # PostgreSQL driver
    "alembic>=1.13",  # database schema migrations
    "fastapi>=0.115",  # HTTP API framework with validation and OpenAPI docs
    "uvicorn>=0.30",  # ASGI server that runs the FastAPI app
]

[project.optional-dependencies]
# Development-only tools; install with: pip install -e ".[dev]"
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "httpx>=0.27",  # required by FastAPI's TestClient
]

[tool.setuptools.packages.find]
# Flat layout: package only `app` (and its subpackages), never tests or the venv.
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: summarize every non-passing test at the end.
# --strict-markers / --strict-config: typos in markers or config fail loudly
# instead of being silently ignored.
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "db: needs the local PostgreSQL database (skipped with a reason if it is not running)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes: unused imports/variables, undefined names
    "I",   # isort: consistent import ordering
    "B",   # flake8-bugbear: likely bugs (mutable defaults, etc.)
    "UP",  # pyupgrade: modern syntax for the target Python version
    "S",   # flake8-bandit: security issues (hard-coded secrets, eval, shell=True, ...)
]

[tool.ruff.lint.per-file-ignores]
# pytest relies on plain `assert`; S101 only matters in application code,
# where asserts are stripped under `python -O` and must not guard security checks.
"tests/**" = ["S101"]
