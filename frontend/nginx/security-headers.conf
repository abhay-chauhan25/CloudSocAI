# Browser security headers for the dashboard's pages and assets.
#
# Content-Security-Policy: the page may load scripts, styles, and data only
# from its own origin. Even if an attacker got text into the page (say, a
# crafted IAM user name rendered somewhere unescaped), the browser would
# refuse to run inline or third-party script. React escapes text by default;
# this is the second layer.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
# Never let the browser guess a content type (e.g. run a JSON file as script).
add_header X-Content-Type-Options "nosniff" always;
# No other site may frame the dashboard (clickjacking).
add_header X-Frame-Options "DENY" always;
# Do not leak dashboard URLs (incident IDs) to other sites.
add_header Referrer-Policy "no-referrer" always;
# The dashboard needs none of these browser features.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
